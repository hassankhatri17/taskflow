[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: let React handle all routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints filenames in /assets (e.g. index-abc123.js), so it's
# safe to cache them for a year — a new deploy just produces new
# filenames. Fixes Lighthouse's "efficient cache policy" flag.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
